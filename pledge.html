<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share your commitment</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: #02235C;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 1.25rem; }
  label { display: block; font-weight: 700; font-size: 1.1rem; margin-bottom: .4rem; }
  textarea {
    width: 100%;
    font: inherit;
    font-size: 1.25rem;
    padding: .8rem;
    border: 3px solid #02235C;
    border-radius: .5rem;
    color: #02235C;
    background: #FFFFFF;
    resize: none;
    min-height: 8rem;
  }
  .row { display: flex; justify-content: space-between; gap: 1rem; margin: .4rem 0 0; font-size: 1rem; }
  button {
    width: 100%;
    margin-top: 1rem;
    min-height: 3.5rem;
    font: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    background: #02235C;
    color: #FFFFFF;
    border: 3px solid #02235C;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:active { background: #FFFFFF; color: #02235C; }
  textarea:focus-visible, button:focus-visible { outline: 4px solid #02235C; outline-offset: 3px; }
  #msg { min-height: 3rem; margin-top: 1.25rem; font-size: 1.4rem; font-weight: 700; }
  #msg.err { color: #7A0000; }
</style>
</head>
<body>
<main>
  <h1 id="prompt">Loading…</h1>

  <form id="f" autocomplete="off">
    <label for="pledge">Your commitment</label>
    <textarea id="pledge" name="pledge" rows="4" maxlength="140"
              autocapitalize="sentences" aria-describedby="hint" required></textarea>
    <div class="row">
      <span id="hint">Short and specific works best.</span>
      <span id="count" aria-hidden="true">0 / 140</span>
    </div>
    <button type="submit">Put it on the screen</button>
  </form>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { firebaseConfig, PLEDGE_PROMPT, PLEDGE_MAX_LEN, collapse } from "./pledge-config.js";

  const db = getDatabase(initializeApp(firebaseConfig));
  const form = document.getElementById("f");
  const box = document.getElementById("pledge");
  const count = document.getElementById("count");
  const msg = document.getElementById("msg");
  let clearTimer;

  document.getElementById("prompt").textContent = PLEDGE_PROMPT;
  document.title = PLEDGE_PROMPT;
  box.maxLength = PLEDGE_MAX_LEN;

  function updateCount() { count.textContent = box.value.length + " / " + PLEDGE_MAX_LEN; }
  box.addEventListener("input", updateCount);
  updateCount();

  function say(text, isError) {
    clearTimeout(clearTimer);
    msg.textContent = text;
    msg.className = isError ? "err" : "";
    if (!isError && text !== "Sending…") {
      clearTimer = setTimeout(() => { msg.textContent = ""; }, 4000);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = collapse(box.value).slice(0, PLEDGE_MAX_LEN);
    if (!text) { box.focus(); return; }

    // Clear right away so a double tap submits nothing twice.
    box.value = "";
    updateCount();
    say("Sending…");

    try {
      await push(ref(db, "pledges"), { text, t: serverTimestamp() });
      say("✓ Got it! Look up at the screen.");
    } catch (err) {
      box.value = text;
      updateCount();
      say("Not sent. Check your connection and tap the button again.", true);
    }
  });
</script>
</body>
</html>
