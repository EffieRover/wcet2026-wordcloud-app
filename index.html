<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add your words</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: #02235C;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 .5rem; }
  .sub { margin: 0 0 1.5rem; font-size: 1.1rem; }
  label { display: block; font-weight: 700; font-size: 1.1rem; margin-bottom: .4rem; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.25rem;
    padding: .8rem;
    border: 3px solid #02235C;
    border-radius: .5rem;
    color: #02235C;
    background: #FFFFFF;
  }
  .hint { margin: .4rem 0 0; font-size: 1rem; }
  button {
    width: 100%;
    margin-top: 1rem;
    min-height: 3.5rem;
    font: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    background: #02235C;
    color: #FFFFFF;
    border: 3px solid #02235C;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:active { background: #FFFFFF; color: #02235C; }
  input:focus-visible, button:focus-visible { outline: 4px solid #02235C; outline-offset: 3px; }
  #msg { min-height: 3rem; margin-top: 1.25rem; font-size: 1.4rem; font-weight: 700; }
  #msg.err { color: #7A0000; }
</style>
</head>
<body>
<main>
  <h1 id="prompt">Loading…</h1>
  <p class="sub">Add as many as you like, one at a time.</p>

  <form id="f" autocomplete="off">
    <label for="word">Your word or short phrase</label>
    <input id="word" name="word" type="text" maxlength="30"
           enterkeyhint="send" autocapitalize="none" autocorrect="off"
           aria-describedby="hint" required>
    <p class="hint" id="hint">Up to 30 characters. Short phrases are fine.</p>
    <button type="submit">Add it</button>
  </form>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { firebaseConfig, PROMPT, MAX_LEN, collapse } from "./config.js";

  const db = getDatabase(initializeApp(firebaseConfig));
  const form = document.getElementById("f");
  const input = document.getElementById("word");
  const msg = document.getElementById("msg");
  let clearTimer;

  document.getElementById("prompt").textContent = PROMPT;
  document.title = PROMPT;
  input.maxLength = MAX_LEN;

  function say(text, isError) {
    clearTimeout(clearTimer);
    msg.textContent = text;
    msg.className = isError ? "err" : "";
    if (!isError && text !== "Sending…") {
      clearTimer = setTimeout(() => { msg.textContent = ""; }, 2500);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = collapse(input.value).slice(0, MAX_LEN);
    if (!text) { input.focus(); return; }

    // Clear right away so the next word can go in (and a double tap submits nothing).
    input.value = "";
    input.focus();
    say("Sending…");

    try {
      await push(ref(db, "submissions"), { text, t: serverTimestamp() });
      say("✓ Got it!");
    } catch (err) {
      input.value = text;
      say("Not sent. Check your connection and tap Add it again.", true);
    }
  });
</script>
</body>
</html>
