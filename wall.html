<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commitment wall</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: #02235C;
    color: #FFFFFF;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* Title stays pinned; only the list below it moves. */
  header { padding: 1.25rem 2.5rem 1rem; flex: none; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 4.2vw, 3.75rem);
    line-height: 1.15;
    font-weight: 700;
  }

  #wrap { flex: 1; min-height: 0; position: relative; }

  #log {
    list-style: none;
    margin: 0;
    padding: 1rem 2.5rem 2rem;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;           /* hidden on the projector; wheel and touch still scroll */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 7%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 7%);
  }
  #log::-webkit-scrollbar { display: none; }

  .card {
    margin: 0 0 1rem;
    padding: .55em .85em;
    background: #0A3A8A;             /* a lighter tint of the primary blue; white text is about 10:1 */
    border-left: .22em solid #FFFFFF;
    border-radius: .35rem;
    color: #FFFFFF;
    font-size: clamp(1.75rem, 3.4vw, 3.4rem);
    line-height: 1.3;
    font-weight: 500;
    overflow-wrap: anywhere;
    animation: arrive .45s ease-out;
  }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(1.5rem); }
    to   { opacity: 1; transform: none; }
  }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0 2.5rem;
    text-align: center;
    font-size: clamp(1.75rem, 3.4vw, 3rem);
    pointer-events: none;
  }
  #empty[hidden] { display: none; }

  /* Controls only appear with ?admin=1 so the projector stays clean. */
  footer {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .6rem 1.25rem;
    padding: .6rem 2.5rem .9rem;
    font-size: 1rem;
  }
  footer[hidden] { display: none; }
  footer button {
    font: inherit;
    color: #FFFFFF;
    background: transparent;
    border: 2px solid #FFFFFF;
    border-radius: .4rem;
    padding: .4rem .9rem;
    cursor: pointer;
  }
  footer button[hidden] { display: none; }
  footer button:hover { background: rgba(255, 255, 255, .14); }
  footer button:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
  #reset.armed { background: #FFFFFF; color: #02235C; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>
<header><h1 id="prompt"></h1></header>

<div id="wrap">
  <ol id="log" role="log" aria-label="Commitments from the room"></ol>
  <p id="empty">Waiting for your commitments…</p>
</div>

<footer id="admin" hidden>
  <button id="signin" type="button">Sign in with Google</button>
  <button id="signout" type="button" hidden>Sign out</button>
  <button id="reset" type="button" hidden>Reset (erase all commitments)</button>
  <span id="status" role="status" aria-live="polite"></span>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, query, limitToLast, onChildAdded, onValue, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { firebaseConfig, PLEDGE_PROMPT, collapse } from "./pledge-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const log = document.getElementById("log");
  const emptyEl = document.getElementById("empty");
  document.getElementById("prompt").textContent = PLEDGE_PROMPT;
  document.title = PLEDGE_PROMPT;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cards = new Map(); // key -> element
  let loaded = false;

  // Newest cards land at the bottom. If you are watching the bottom, the list drifts up to
  // keep the newest in view and the oldest slide off the top. If you scrolled back up to
  // read one, new cards will not yank you away from it.
  const q = query(ref(db, "pledges"), limitToLast(300));

  onChildAdded(q, (snap) => {
    const text = collapse(snap.val() && snap.val().text ? snap.val().text : "");
    if (!text || cards.has(snap.key)) return;

    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;

    const li = document.createElement("li");
    li.className = "card";
    li.textContent = text; // textContent, never innerHTML
    if (!loaded) li.style.animation = "none";
    log.appendChild(li);
    cards.set(snap.key, li);
    emptyEl.hidden = true;

    if (!loaded || nearBottom) {
      requestAnimationFrame(() => {
        log.scrollTo({ top: log.scrollHeight, behavior: (loaded && !reduceMotion) ? "smooth" : "auto" });
      });
    }
  });

  // Fires after the existing cards have been delivered; from then on, arrivals animate.
  onValue(query(ref(db, "pledges"), limitToLast(1)), () => { loaded = true; }, { onlyOnce: true });

  // Removed (after a reset).
  onValue(ref(db, "pledges"), (snap) => {
    if (!snap.exists()) {
      log.replaceChildren();
      cards.clear();
      emptyEl.hidden = false;
    }
  });

  // ---- admin controls (only with ?admin=1) ----
  if (new URLSearchParams(location.search).get("admin") === "1") {
    const footer = document.getElementById("admin");
    const statusEl = document.getElementById("status");
    const signinBtn = document.getElementById("signin");
    const signoutBtn = document.getElementById("signout");
    const resetBtn = document.getElementById("reset");
    footer.hidden = false;
    let user = null;

    signinBtn.addEventListener("click", async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (err) { statusEl.textContent = "Sign-in did not finish. Try again (allow the popup)."; }
    });
    signoutBtn.addEventListener("click", () => signOut(auth));
    onAuthStateChanged(auth, (u) => {
      user = u;
      signinBtn.hidden = !!u;
      signoutBtn.hidden = !u;
      resetBtn.hidden = !u;
      statusEl.textContent = u ? "Signed in." : "Not signed in.";
    });

    const LABEL = "Reset (erase all commitments)";
    let armTimer;
    function disarm() {
      clearTimeout(armTimer);
      resetBtn.classList.remove("armed");
      resetBtn.textContent = LABEL;
    }
    resetBtn.addEventListener("click", async () => {
      if (!user) return;
      if (!resetBtn.classList.contains("armed")) {
        resetBtn.classList.add("armed");
        resetBtn.textContent = "Click again to erase EVERYTHING";
        statusEl.textContent = "Click Reset again within 5 seconds to erase every commitment.";
        armTimer = setTimeout(() => { disarm(); statusEl.textContent = "Reset cancelled."; }, 5000);
        return;
      }
      disarm();
      try {
        await remove(ref(db, "pledges"));
        statusEl.textContent = "Everything erased.";
      } catch (err) {
        statusEl.textContent = "Could not reset. Have the updated rules been published in Firebase?";
      }
    });
  }
</script>
</body>
</html>
